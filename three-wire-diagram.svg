<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Three-wire measurement of a 60° external thread</title>
  <desc id="desc">Axial cross-section of a 60-degree external thread measured with three best-size wires and a micrometer. Two wires sit in adjacent top grooves and one wire sits in the opposing bottom groove, offset by half a pitch. The micrometer reads measurement over wires M. Best-size wire diameter W equals 0.57735 times pitch P. Wires contact the flanks at the pitch diameter E. M equals E plus 3W minus 0.86603 times P.</desc>
  <defs>
    <linearGradient id="anvilUp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D2B33"/>
      <stop offset="1" stop-color="#2B3D47"/>
    </linearGradient>
    <linearGradient id="anvilDn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3D47"/>
      <stop offset="1" stop-color="#1D2B33"/>
    </linearGradient>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e4eef1"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#c3d4da" stroke-width="1.35"/>
    </pattern>
    <clipPath id="shaftClip">
      <path d="M 410.800 182.071 L 476.375 182.071 L 505.938 233.274 L 522.062 233.274 L 551.625 182.071 L 562.375 182.071 L 591.938 233.274 L 608.062 233.274 L 637.625 182.071 L 648.375 182.071 L 677.938 233.274 L 694.062 233.274 L 723.625 182.071 L 734.375 182.071 L 763.938 233.274 L 780.062 233.274 L 809.625 182.071 L 918.200 182.071 L 918.200 533.929 L 852.625 533.929 L 823.062 482.726 L 806.938 482.726 L 777.375 533.929 L 766.625 533.929 L 737.062 482.726 L 720.938 482.726 L 691.375 533.929 L 680.625 533.929 L 651.062 482.726 L 634.938 482.726 L 605.375 533.929 L 594.625 533.929 L 565.062 482.726 L 548.938 482.726 L 519.375 533.929 L 410.800 533.929 Z"/>
    </clipPath>
  </defs>
  <rect width="1100" height="720" fill="#ffffff"/>

  <!-- Shaft body + 45° section hatching -->
  <path d="M 410.800 182.071 L 476.375 182.071 L 505.938 233.274 L 522.062 233.274 L 551.625 182.071 L 562.375 182.071 L 591.938 233.274 L 608.062 233.274 L 637.625 182.071 L 648.375 182.071 L 677.938 233.274 L 694.062 233.274 L 723.625 182.071 L 734.375 182.071 L 763.938 233.274 L 780.062 233.274 L 809.625 182.071 L 918.200 182.071 L 918.200 533.929 L 852.625 533.929 L 823.062 482.726 L 806.938 482.726 L 777.375 533.929 L 766.625 533.929 L 737.062 482.726 L 720.938 482.726 L 691.375 533.929 L 680.625 533.929 L 651.062 482.726 L 634.938 482.726 L 605.375 533.929 L 594.625 533.929 L 565.062 482.726 L 548.938 482.726 L 519.375 533.929 L 410.800 533.929 Z" fill="#e4eef1" stroke="none"/>
  <rect width="1100" height="720" fill="url(#hatch)" clip-path="url(#shaftClip)"/>
  <path d="M 410.800 182.071 L 476.375 182.071 L 505.938 233.274 L 522.062 233.274 L 551.625 182.071 L 562.375 182.071 L 591.938 233.274 L 608.062 233.274 L 637.625 182.071 L 648.375 182.071 L 677.938 233.274 L 694.062 233.274 L 723.625 182.071 L 734.375 182.071 L 763.938 233.274 L 780.062 233.274 L 809.625 182.071 L 918.200 182.071 L 918.200 533.929 L 852.625 533.929 L 823.062 482.726 L 806.938 482.726 L 777.375 533.929 L 766.625 533.929 L 737.062 482.726 L 720.938 482.726 L 691.375 533.929 L 680.625 533.929 L 651.062 482.726 L 634.938 482.726 L 605.375 533.929 L 594.625 533.929 L 565.062 482.726 L 548.938 482.726 L 519.375 533.929 L 410.800 533.929 Z" fill="none" stroke="#2B3D47" stroke-width="2.4" stroke-linejoin="miter"/>

  <!-- Dash-dot centerline -->
  <line x1="388.800" y1="358.000" x2="940.200" y2="358.000" stroke="#2B3D47" stroke-width="1.35" stroke-dasharray="14 6 2.4 6" fill="none"/>

  <!-- Pitch diameter (E) dashed lines -->
  <line x1="418.800" y1="210.000" x2="910.200" y2="210.000" stroke="#2E7386" stroke-width="1.7" stroke-dasharray="9 6" fill="none"/>
  <line x1="418.800" y1="506.000" x2="910.200" y2="506.000" stroke="#2E7386" stroke-width="1.7" stroke-dasharray="9 6" fill="none"/>

  <!-- Best-size wires: two adjacent top, one bottom at P/2 -->
  <circle cx="600.000" cy="197.587" r="24.826" fill="#9FD3E1" stroke="#2E7386" stroke-width="2"/><ellipse cx="592.056" cy="189.643" rx="7.944" ry="5.462" fill="#ffffff" opacity="0.55"/><line x1="595.500" y1="197.587" x2="604.500" y2="197.587" stroke="#2E7386" stroke-width="1.2"/><line x1="600.000" y1="193.087" x2="600.000" y2="202.087" stroke="#2E7386" stroke-width="1.2"/>
  <circle cx="686.000" cy="197.587" r="24.826" fill="#9FD3E1" stroke="#2E7386" stroke-width="2"/><ellipse cx="678.056" cy="189.643" rx="7.944" ry="5.462" fill="#ffffff" opacity="0.55"/><line x1="681.500" y1="197.587" x2="690.500" y2="197.587" stroke="#2E7386" stroke-width="1.2"/><line x1="686.000" y1="193.087" x2="686.000" y2="202.087" stroke="#2E7386" stroke-width="1.2"/>
  <circle cx="643.000" cy="518.413" r="24.826" fill="#9FD3E1" stroke="#2E7386" stroke-width="2"/><ellipse cx="635.056" cy="510.469" rx="7.944" ry="5.462" fill="#ffffff" opacity="0.55"/><line x1="638.500" y1="518.413" x2="647.500" y2="518.413" stroke="#2E7386" stroke-width="1.2"/><line x1="643.000" y1="513.913" x2="643.000" y2="522.913" stroke="#2E7386" stroke-width="1.2"/>

  <!-- Micrometer anvils (drawn after wires so the contact face sits cleanly on the tangent) -->
  <rect x="557.174" y="132.761" width="171.652" height="40.000" rx="2" fill="url(#anvilUp)"/>
  <line x1="557.174" y1="172.761" x2="728.826" y2="172.761" stroke="#2E7386" stroke-width="3.2" stroke-linecap="square"/>
  <rect x="557.174" y="543.239" width="171.652" height="40.000" rx="2" fill="url(#anvilDn)"/>
  <line x1="557.174" y1="543.239" x2="728.826" y2="543.239" stroke="#2E7386" stroke-width="3.2" stroke-linecap="square"/>
  <text x="643.000" y="152.761" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" font-weight="700" fill="#EAF7EA">Micrometer anvil</text>
  <text x="643.000" y="563.239" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" font-weight="700" fill="#EAF7EA">Micrometer anvil</text>

  <!-- 60° included angle in the open top-left groove (center x=514) -->
  <path d="M 494.650 213.724 A 38.700 38.700 0 0 0 533.350 213.724" fill="none" stroke="#2E7386" stroke-width="2.2"/>
  <text x="514.000" y="146.000" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2E7386">60°</text>

  <!-- Pitch (P): horizontal dimension above the anvil; extensions do not cross the anvil body -->
  <line x1="600.000" y1="132.761" x2="600.000" y2="104.761" stroke="#2E7386" stroke-width="1.4" fill="none"/>
  <line x1="686.000" y1="132.761" x2="686.000" y2="104.761" stroke="#2E7386" stroke-width="1.4" fill="none"/>
  <line x1="600.000" y1="104.761" x2="686.000" y2="104.761" stroke="#2E7386" stroke-width="2" fill="none"/>
  <polygon points="609.511,107.851 600.000,104.761 609.511,101.671" fill="#2E7386"/>
  <polygon points="676.489,101.671 686.000,104.761 676.489,107.851" fill="#2E7386"/>
  <text x="643.000" y="88.761" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#1D2B33">Pitch (P)</text>

  <!-- Measurement over wires (M): vertical span between anvil contact faces -->
  <line x1="557.174" y1="172.761" x2="356.800" y2="172.761" stroke="#2E7386" stroke-width="1.4"/>
  <line x1="557.174" y1="543.239" x2="356.800" y2="543.239" stroke="#2E7386" stroke-width="1.4"/>
  <line x1="356.800" y1="172.761" x2="356.800" y2="543.239" stroke="#2E7386" stroke-width="2"/>
  <polygon points="353.710,182.271 356.800,172.761 359.890,182.271" fill="#2E7386"/>
  <polygon points="359.890,533.729 356.800,543.239 353.710,533.729" fill="#2E7386"/>
  <text text-anchor="end" font-family="Segoe UI, Arial, Helvetica, sans-serif" fill="#1D2B33">
    <tspan x="340.800" y="330.000" font-size="26" font-weight="700">Measurement</tspan>
    <tspan x="340.800" y="358.000" font-size="26" font-weight="700">over wires (M)</tspan>
    <tspan x="340.800" y="384.000" font-size="16" font-weight="600" fill="#2E7386" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">M = E + 3W − 0.86603 × P</tspan>
  </text>

  <!-- Pitch dia. (E) labels -->
  <text text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-weight="700" fill="#2E7386">
    <tspan x="928.200" y="198.000" font-size="24">Pitch</tspan>
    <tspan x="928.200" y="224.000" font-size="24">dia. (E)</tspan>
  </text>
  <text text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-weight="700" fill="#2E7386">
    <tspan x="928.200" y="494.000" font-size="24">Pitch</tspan>
    <tspan x="928.200" y="520.000" font-size="24">dia. (E)</tspan>
  </text>

  <!-- Wire dia. (W): diameter dimension through the right top wire, then a leader -->
  <line x1="666.982" y1="213.545" x2="705.018" y2="181.629" stroke="#2E7386" stroke-width="1.6" fill="none"/>
  <polygon points="697.600,184.626 705.018,181.629 700.779,188.413" fill="#2E7386"/>
  <polygon points="674.400,210.548 666.982,213.545 671.221,206.760" fill="#2E7386"/>
  <path d="M 705.018 181.629 L 718.000 177.400 L 770.000 177.400 L 795.000 86.000 L 880.000 86.000" fill="none" stroke="#2E7386" stroke-width="1.6"/>
  <text text-anchor="start" font-family="Segoe UI, Arial, Helvetica, sans-serif" fill="#1D2B33">
    <tspan x="888.000" y="78.000" font-size="26" font-weight="700">Wire dia. (W)</tspan>
    <tspan x="888.000" y="102.000" font-size="16" font-weight="600" fill="#2E7386" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">Best W = 0.57735 × P</tspan>
  </text>
</svg>
